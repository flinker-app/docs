<template id="example-guide">
<h2 data-example-title>View a bridge on a map</h2>
<p data-example-description>See how a bridge connects the surrounding roads across a river, and switch between street and satellite maps.</p>
<h3>Try it</h3><ol><li>Use the map to locate the bridge relative to the roads and river.</li><li>Open View at the top right → Layers and choose Satellite or Street to compare the model with the surrounding area.</li><li>Zoom between the bridge and its wider setting.</li></ol><h2>Developer integration</h2><p>After <code>viewer.add()</code>, call <code>viewer.toggleMap(true)</code> to show the project's map context. The SDK owns map styles and terrain controls. The source placement and height limitations are listed under Model notes.</p><p>Copy this folder and serve it over HTTP, for example <code>python -m http.server 8080</code>. Open <code>http://localhost:8080/</code>; the SDK and sample downloads require internet access.</p>
<p>The host uses <code>await viewer.IfcAPI</code> to open the hash-verified source, writes the projected CRS vertical datum with <code>WriteLine()</code>, and saves the edited bytes with <code>SaveModel()</code>. It closes the native model and disposes WASM before <code>viewer.add()</code>. See the <a href="https://thatopen.github.io/engine_web-ifc/docs/classes/web-ifc.IfcAPI.html">complete web-ifc API reference</a>.</p><h3>Model notes</h3><p>Height datum set to NAP (inferred); geometry retained. The publisher reports a small XYZ offset. Optional terrain is a 30 m surface.</p>

<p>The example supplements the missing vertical datum as NAP, inferred from the publisher’s successful height validation against AHN (NAP). Original geometry, map-conversion coordinates and heights are retained. The publisher reports a small XYZ offset against AHN. Copernicus is a 30 m surface model, so this is not a certified survey overlay.</p>

<script type="module">
import { Viewer } from "https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js";
async function withIfcModel(blob, read) {
    const api = await viewer.IfcAPI;
    await api.Init();
    let modelID = -1;
    try {
        modelID = api.OpenModel(new Uint8Array(await blob.arrayBuffer()));
        if (modelID < 0) throw new Error('The native IFC API could not open the model.');
        return await read(api, modelID);
    } finally {
        if (modelID >= 0) api.CloseModel(modelID);
        api.Dispose();
    }
}
async function correctSampleCrs(file, correction) {
    const bytes = await file.arrayBuffer();
    const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(byte => byte.toString(16).padStart(2, '0')).join('');
    if (hash !== correction.sha256) throw new Error('The source differs from the verified sample; its coordinate correction was not applied.');
    return withIfcModel(new Blob([bytes]), (api, modelID) => {
        const ids = api.GetLineIDsWithType(modelID, api.GetTypeCodeFromName('IFCPROJECTEDCRS'), true);
        let records;
        try {
            records = api.GetLines(modelID, Array.from({ length: ids.size() }, (_, index) => ids.get(index)))
                .filter(line => line.Name?.value === correction.expectedName);
        } finally { ids.delete(); }
        if (records.length !== 1 || records[0].VerticalDatum !== null)
            throw new Error('The sample CRS differs from its published reference.');
        const crs = records[0];
        crs.VerticalDatum = api.CreateIfcType(modelID, api.GetTypeCodeFromName('IFCIDENTIFIER'), correction.verticalDatum);
        api.WriteLine(modelID, crs);
        return api.SaveModel(modelID);
    });
}
// Example-only download feedback. All file parsing remains in the published SDK.
async function loadExampleFile(name, url, load = blob => viewer.add(name, blob), size = 0) {
    const show = stage => viewer.setMessage(name + ': ' + stage, { type: 'loading' });
    const chunks = [], chunkSize = 4 * 1024 * 1024;
    let offset = 0, attempts = 0, action = 'download', type = '';
    try {
        await show('Downloading');
        while (!size || offset < size) {
            try {
                const end = Math.min(offset + chunkSize, size || Infinity) - 1;
                const response = await fetch(url, {
                    headers: { Range: 'bytes=' + offset + '-' + end },
                    cache: 'no-store', signal: AbortSignal.timeout(60000),
                });
                if (!response.ok) {
                    await response.body?.cancel();
                    // GitHub raw hides Content-Range from browser JavaScript: probe EOF.
                    if (response.status === 416 && offset && !size) break;
                    throw Object.assign(new Error('HTTP ' + response.status), { retry: [408, 429].includes(response.status) || response.status >= 500 });
                }
                const range = response.headers.get('content-range')?.match(/^bytes (\d+)-(\d+)\/(\d+)$/);
                if (range && Number(range[1]) !== offset) throw new TypeError('Unexpected byte range');
                size ||= Number(range?.[3]) || 0;
                const bytes = await response.arrayBuffer();
                const expected = response.status === 206 ? (size ? Math.min(chunkSize, size - offset) : 0) : size;
                if (!bytes.byteLength || (expected && bytes.byteLength !== expected) || (response.status === 206 && bytes.byteLength > chunkSize))
                    throw new TypeError('Incomplete download at byte ' + offset);
                if (response.status === 200) chunks.length = 0; // Server ignored Range.
                chunks.push(bytes);
                offset = response.status === 200 ? bytes.byteLength : offset + bytes.byteLength;
                type = response.headers.get('content-type') || '';
                attempts = 0;
                if (response.status === 200) break;
                await show('Downloading' + (size ? ' ' + Math.round(offset / size * 100) + '%' : ''));
            }
            catch (error) {
                if (error.retry === false || ++attempts === 3) throw error;
                await show('Retrying download');
                await new Promise(resolve => setTimeout(resolve, 500 * 2 ** (attempts - 1)));
            }
        }
        action = 'open';
        const result = await load(new Blob(chunks, { type }), show);
        if (result?.isError) throw new Error('The viewer could not open the file');
        await viewer.setMessage(null);
        return result;
    }
    catch (error) {
        throw new Error('Could not ' + action + ' ' + name + (action === 'download' ? ' from ' + url : '') + ': ' + error.message, { cause: error });
    }
}


const { assets } = JSON.parse(document.getElementById("example-data").textContent);

const viewer = new Viewer('#ifc-viewer');
window.exampleViewer = viewer;
document.body.dataset.exampleState = 'loading';
const imported = new Set();
const retry = document.querySelector('#sample-retry');
let running = false;
async function load() {
    if (running)
        return;
    running = true;
    retry.hidden = true;
    document.body.dataset.exampleState = 'loading';
    try {
        await viewer.ready;
        for (const asset of assets) {
            if (imported.has(asset.id))
                continue;
            await loadExampleFile(asset.name, asset.url, async (blob, stage) => {
                await stage('Preparing coordinates');
                blob = await correctSampleCrs(blob, asset.crsCorrection);
                return viewer.add(asset.name, blob);
            }, asset.bytes);
            imported.add(asset.id);
        }
        await viewer.toggleMap(true);
        document.body.dataset.exampleState = 'loaded';
    }
    catch (error) {
        document.body.dataset.exampleState = 'error';
        await viewer.setMessage(error instanceof Error ? error.message : String(error), { type: 'error' });
        retry.hidden = false;
    }
    finally {
        running = false;
    }
}
retry.addEventListener('click', () => { void load(); });
void load();
