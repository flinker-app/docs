<template id="example-guide">
<h2 data-example-title>Share a model view with a link</h2>
<p data-example-description>Create a BCF topic from the model view, then share its link or download the BCF file.</p>
<h3>Try it</h3><ol><li>Orbit, pan or zoom to the view you want to share.</li><li>Click Create link, then Copy link or Download BCF. Open view reopens the shared BCF topic.</li><li>The same pinned model loads and the saved BCF view is restored.</li></ol>
<h3>Developer integration</h3><p><code>viewer.createTopic(undefined, { snapshot: false })</code> captures the current view in a BCF 3.0 archive. <code>bcf.save()</code> writes the same standard BCF bytes used by the download and the URL fragment. The optional snapshot is omitted to keep links smaller. <code>bcf.load()</code> validates the archive before <code>viewer.add()</code> and <code>viewer.selectTopic(id)</code> restore it. The URL encoding belongs to this page; the BCF payload follows buildingSMART BCF-XML. Large selections or image attachments can exceed the link limit; download the BCF file in that case.</p><p>Copy this HTML and serve it over HTTP. The pinned SDK and model download require internet access.</p>
</template>

<script type="module">
import { Viewer, bcf } from 'https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js';

const { assets } = JSON.parse(document.getElementById('example-data').textContent);
const viewer = new Viewer('#ifc-viewer');
window.exampleViewer = viewer;
let running = false, modelLoaded = false;
const retry = document.getElementById('retry');
async function run() {
    if (running) return;
    running = true;
    retry.hidden = true;
    document.body.dataset.exampleState = 'loading';
    try {
        await viewer.ready;
        if (typeof viewer.createTopic !== 'function') throw new Error('This SDK version does not support creating BCF topics.');
        if (!modelLoaded) {
            await loadExampleFile(assets[0].name, assets[0].url, undefined, assets[0].bytes);
            modelLoaded = true;
        }
        await restoreInitialLink();
        create.disabled = false;
        document.body.dataset.exampleState = 'loaded';
    } catch (error) {
        document.body.dataset.exampleState = 'error';
        retry.hidden = false;
        await viewer.setMessage(error.message, { type: 'error' });
    } finally { running = false; }
}
retry.addEventListener('click', () => { void run(); });

async function loadExampleFile(name, url, load = blob => viewer.add(name, blob), size = 0) {
    const show = stage => viewer.setMessage(name + ': ' + stage, { type: 'loading' });
    const chunks = [], chunkSize = 4 * 1024 * 1024;
    let offset = 0, attempts = 0, action = 'download', type = '';
    try {
        await show('Downloading');
        while (!size || offset < size) {
            try {
                const end = Math.min(offset + chunkSize, size || Infinity) - 1;
                const response = await fetch(url, {
                    headers: { Range: 'bytes=' + offset + '-' + end },
                    cache: 'no-store', signal: AbortSignal.timeout(60000),
                });
                if (!response.ok) {
                    await response.body?.cancel();
                    // GitHub raw hides Content-Range from browser JavaScript: probe EOF.
                    if (response.status === 416 && offset && !size) break;
                    throw Object.assign(new Error('HTTP ' + response.status), { retry: [408, 429].includes(response.status) || response.status >= 500 });
                }
                const range = response.headers.get('content-range')?.match(/^bytes (\d+)-(\d+)\/(\d+)$/);
                if (range && Number(range[1]) !== offset) throw new TypeError('Unexpected byte range');
                size ||= Number(range?.[3]) || 0;
                const bytes = await response.arrayBuffer();
                const expected = response.status === 206 ? (size ? Math.min(chunkSize, size - offset) : 0) : size;
                if (!bytes.byteLength || (expected && bytes.byteLength !== expected) || (response.status === 206 && bytes.byteLength > chunkSize))
                    throw new TypeError('Incomplete download at byte ' + offset);
                if (response.status === 200) chunks.length = 0; // Server ignored Range.
                chunks.push(bytes);
                offset = response.status === 200 ? bytes.byteLength : offset + bytes.byteLength;
                type = response.headers.get('content-type') || '';
                attempts = 0;
                if (response.status === 200) break;
                await show('Downloading' + (size ? ' ' + Math.round(offset / size * 100) + '%' : ''));
            }
            catch (error) {
                if (error.retry === false || ++attempts === 3) throw error;
                await show('Retrying download');
                await new Promise(resolve => setTimeout(resolve, 500 * 2 ** (attempts - 1)));
            }
        }
        action = 'open';
        const result = await load(new Blob(chunks, { type }), show);
        if (result?.isError) throw new Error('The viewer could not open the file');
        await viewer.setMessage(null);
        return result;
    }
    catch (error) {
        throw new Error('Could not ' + action + ' ' + name + (action === 'download' ? ' from ' + url : '') + ': ' + error.message, { cause: error });
    }
}

const input = document.getElementById('view-link');
const create = document.getElementById('create-link');
const copy = document.getElementById('copy-link');
const open = document.getElementById('open-link');
const download = document.getElementById('download-bcf');
const status = document.getElementById('copy-status');
const initialHash = location.hash;
let restored = false, downloadUrl;
function encodeBcf(bytes) {
    const value = btoa(Array.from(bytes, byte => String.fromCharCode(byte)).join('')).replaceAll('+','-').replaceAll('/','_').replace(/=+$/, '');
    if (value.length > 24000) throw new Error('This BCF is too large for a link. Download the BCF file instead.');
    return '#bcf=' + value;
}
async function decodeBcf(hash) {
    if (!/^#bcf=[A-Za-z0-9_-]+$/.test(hash) || hash.length > 24005) throw new Error('This BCF link is invalid or too large.');
    const bytes = Uint8Array.from(atob(hash.slice(5).replaceAll('-','+').replaceAll('_','/')), c => c.charCodeAt(0));
    if (bytes[0] !== 80 || bytes[1] !== 75) throw new Error('This link must contain a BCF archive.');
    const archive = await bcf.load(bytes, { limits: { maxInputBytes: 18000, maxEntryBytes: 2 * 1024 * 1024, maxTotalBytes: 2 * 1024 * 1024 } });
    if (archive.kind !== 'archive') throw new Error('This link must contain a BCF archive.');
    const topic = Object.values(archive.entries).find(entry => entry.document?.root.name === 'Markup')
        ?.document.root.content.find(node => node.name === 'Topic');
    if (!topic) throw new Error('This BCF archive contains no topic.');
    return { bytes, topicGuid: topic.attributes.Guid };
}
function showBcf(bytes) {
    if (downloadUrl) URL.revokeObjectURL(downloadUrl);
    downloadUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
    download.href = downloadUrl; download.hidden = false;
    input.value = ''; copy.disabled = true; open.hidden = true; status.textContent = '';
    const hash = encodeBcf(bytes);
    history.replaceState(null, '', hash);
    input.value = location.href; open.href = location.href;
    copy.disabled = false; open.hidden = false;
}
async function restoreInitialLink() {
    if (restored) return;
    restored = true;
    if (!initialHash) return;
    try {
        await viewer.setMessage('Opening the shared BCF topic', { type: 'loading' });
        const { bytes, topicGuid } = await decodeBcf(initialHash);
        const imported = await viewer.add('shared-view.bcf', bytes);
        if (imported?.isError) throw new Error('The shared BCF topic could not be opened.');
        const selected = await viewer.selectTopic(topicGuid);
        if (selected?.isError) throw new Error('The shared BCF view could not be restored.');
        showBcf(bytes);
        await viewer.setMessage(null);
    } catch (error) {
        await viewer.setMessage(error.message + ' You can create a new link from the model.', { type: 'error' });
    }
}
create.addEventListener('click', async () => {
    create.disabled = true;
    try {
        await viewer.setMessage('Creating the BCF topic', { type: 'loading' });
        const archive = await viewer.createTopic(undefined, { snapshot: false });
        showBcf(await bcf.save(archive));
        await viewer.setMessage(null);
    } catch (error) { await viewer.setMessage(error.message, { type: 'error' }); }
    finally { create.disabled = false; }
});
input.addEventListener('click', () => input.select());
copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(input.value); status.textContent = 'Copied'; }
    catch { input.focus(); input.select(); status.textContent = 'Press Ctrl+C / ⌘C to copy.'; }
});
window.addEventListener('pagehide', () => { if (downloadUrl) URL.revokeObjectURL(downloadUrl); });
void run();
</script>
