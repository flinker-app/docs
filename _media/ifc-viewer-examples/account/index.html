<body>
<main id="example-viewer-mount" aria-label="Model viewer"><bim-grid id="ifc-viewer"></bim-grid></main>
<aside class="example-ui example-controls" aria-label="Viewer messages">
<h2>Viewer messages</h2>
<p>Choose a message type, enter your text and click Display message.</p>
<fieldset id="host-controls" disabled>
      <div id="message-type" class="checkbox-row" role="group" aria-label="Message type"><label class="example-option"><input type="radio" name="message-type" value="Info" checked>Info</label><label class="example-option"><input type="radio" name="message-type" value="Success">Success</label><label class="example-option"><input type="radio" name="message-type" value="Warning">Warning</label><label class="example-option"><input type="radio" name="message-type" value="Error">Error</label><label class="example-option"><input type="radio" name="message-type" value="Loading">Loading</label><label class="example-option"><input type="radio" name="message-type" value="Hidden">Hidden</label></div>
      <label>Message text <input id="message-text" value="Project information is available for review."></label>
      <button id="show-message" type="button">Display message</button>
    </fieldset>
</aside>
<template id="example-guide">
<h2 data-example-title>Show messages in the viewer</h2>
<p data-example-description>Choose a message type, enter your own text and preview information, success, warning, error or loading messages in the viewer.</p>
<h2>Developer integration</h2><p>Use <code>viewer.setMessage(textOrNull, options?)</code> for project notices. Pass a string to show a message or <code>null</code> to dismiss it. These are message previews; no project data is saved or imported by this page.</p><p>Copy this folder and serve it over HTTP, for example <code>python -m http.server 8080</code>. Open <code>http://localhost:8080/</code>; the SDK and sample downloads require internet access.</p>
</template>
<template id="example-notices">
<h2>Sources and license notices</h2><p>No third-party model data is used by this example.</p>
</template>
<script type="module">
import { Viewer } from 'https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js';
const viewer = new Viewer('#ifc-viewer');
window.exampleViewer = viewer;
document.body.dataset.exampleState = 'loading';
const controls = document.getElementById('host-controls');
const types = document.getElementById('message-type');
let messageType = 'Info';
const text = document.getElementById('message-text');
const messages = {
    Info: 'Project information is available for review.',
    Success: 'Your changes are ready.',
    Warning: 'Please review the highlighted item.',
    Error: 'The action could not be completed. Try again.',
    Loading: 'Preparing project data…',
};
async function run(action) {
    controls.disabled = true;
    try {
        await action();
    }
    catch (error) {
        await viewer.setMessage(error.message, { type: 'error' });
    }
    finally {
        controls.disabled = false;
    }
}
function applyMessage() {
    return viewer.setMessage(messageType === 'Hidden' ? null : text.value,
        messageType === 'Info' ? undefined : { type: messageType.toLowerCase() });
}
types.addEventListener('change', event => {
    messageType = event.target.value;
    text.value = messages[messageType] ?? text.value;
    void run(applyMessage);
});
document.getElementById('show-message').addEventListener('click', () => { void run(applyMessage); });
await viewer.ready;
controls.disabled = false;
await applyMessage();
document.body.dataset.exampleState = 'loaded';
  </script>
</body>
