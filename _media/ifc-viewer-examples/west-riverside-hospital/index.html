<h2 data-example-title>Federate West Riverside Hospital</h2>
<p data-example-description>Explore West Riverside Hospital&#39;s seven IFC4 discipline models federated in one viewer: architecture, structure and building services.</p>
<h3>Try it</h3>
<ol><li>Open Files (folder) on the left toolbar to see the seven IFC4 models in the federation.</li><li>Toggle file checkboxes to inspect architecture, structure, mechanical, plumbing, electrical, fire alarm and sprinkler models in their shared coordinates.</li><li>Select a component, then click 1 element selected at the top left to open Properties.</li></ol>
<h3>About this example</h3>
<p>For BIM users reviewing a multidisciplinary hospital project. The seven IFC4 files from the linked West Riverside Hospital folder are imported unchanged into one viewer, with their original names and placements. The complete download is approximately 224 MB; allow time and memory for all models to open.</p>
<p>The standalone page reads its source list once and adds files sequentially through the published SDK. Download feedback and errors use the viewer's message API. Retry sample resumes with the first unfinished file and retains files already imported.</p>
<p>Copy this folder and serve it over HTTP, for example <code>python -m http.server 8080</code>. Open <code>http://localhost:8080/</code>; the SDK and sample downloads require internet access.</p>

<script type="module">
import { Viewer } from "https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js";
// Example-only download feedback. All file parsing remains in the published SDK.
async function loadExampleFile(name, url, load = blob => viewer.add(name, blob), size = 0) {
    const show = stage => viewer.setMessage(name + ': ' + stage, { type: 'loading' });
    const chunks = [], chunkSize = 4 * 1024 * 1024;
    let offset = 0, attempts = 0, action = 'download', type = '';
    try {
        await show('Downloading');
        while (!size || offset < size) {
            try {
                const end = Math.min(offset + chunkSize, size || Infinity) - 1;
                const response = await fetch(url, {
                    headers: { Range: 'bytes=' + offset + '-' + end },
                    cache: 'no-store', signal: AbortSignal.timeout(60000),
                });
                if (!response.ok) {
                    await response.body?.cancel();
                    // GitHub raw hides Content-Range from browser JavaScript: probe EOF.
                    if (response.status === 416 && offset && !size) break;
                    throw Object.assign(new Error('HTTP ' + response.status), { retry: [408, 429].includes(response.status) || response.status >= 500 });
                }
                const range = response.headers.get('content-range')?.match(/^bytes (\d+)-(\d+)\/(\d+)$/);
                if (range && Number(range[1]) !== offset) throw new TypeError('Unexpected byte range');
                size ||= Number(range?.[3]) || 0;
                const bytes = await response.arrayBuffer();
                const expected = response.status === 206 ? (size ? Math.min(chunkSize, size - offset) : 0) : size;
                if (!bytes.byteLength || (expected && bytes.byteLength !== expected) || (response.status === 206 && bytes.byteLength > chunkSize))
                    throw new TypeError('Incomplete download at byte ' + offset);
                if (response.status === 200) chunks.length = 0; // Server ignored Range.
                chunks.push(bytes);
                offset = response.status === 200 ? bytes.byteLength : offset + bytes.byteLength;
                type = response.headers.get('content-type') || '';
                attempts = 0;
                if (response.status === 200) break;
                await show('Downloading' + (size ? ' ' + Math.round(offset / size * 100) + '%' : ''));
            }
            catch (error) {
                if (error.retry === false || ++attempts === 3) throw error;
                await show('Retrying download');
                await new Promise(resolve => setTimeout(resolve, 500 * 2 ** (attempts - 1)));
            }
        }
        action = 'open';
        const result = await load(new Blob(chunks, { type }), show);
        if (result?.isError) throw new Error('The viewer could not open the file');
        await viewer.setMessage(null);
        return result;
    }
    catch (error) {
        throw new Error('Could not ' + action + ' ' + name + (action === 'download' ? ' from ' + url : '') + ': ' + error.message, { cause: error });
    }
}

const { assets } = JSON.parse(document.getElementById('example-data').textContent);
const viewer = new Viewer('#ifc-viewer');
window.exampleViewer = viewer;

const imported = new Set();
const retry = document.querySelector('#sample-retry');
let running = false;
async function load() {
    if (running) return;
    running = true;
    retry.hidden = true;
    document.body.dataset.exampleState = 'loading';
    try {
        await viewer.ready;
        for (const asset of assets) {
            if (imported.has(asset.id)) continue;
            await loadExampleFile(asset.name, asset.url, blob => viewer.add(asset.name, blob), asset.bytes);
            imported.add(asset.id);
        }
        document.body.dataset.exampleState = 'loaded';
    }
    catch (error) {
        document.body.dataset.exampleState = 'error';
        await viewer.setMessage(error instanceof Error ? error.message : String(error), { type: 'error' });
        retry.hidden = false;
    }
    finally {
        running = false;
    }
}
retry.addEventListener('click', () => { void load(); });
void load();
</script>
