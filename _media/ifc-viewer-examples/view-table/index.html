<template id="example-guide">
<h2 data-example-title>Show selected components in a table</h2><p data-example-description>Click a duct or fitting to see its name, floor and system in a table. Select more components to compare their records.</p><h3>Try it</h3><p>Click a duct or fitting. Ctrl/⌘+click adds components to the selection and table.</p><h3>Developer integration</h3><p><code>viewer.onViewChange</code> provides selected GlobalIds. The page resolves them through <code>viewer.IfcAPI.GetExpressIdFromGuid</code>, then queries entity names, storeys and property sets from its independently opened native model. It does not ship a cached property table. An outdated query cannot replace a newer selection.</p><p>The page keeps its native IFC model open for selection queries and closes it when the page is unloaded. <code>viewer.clear()</code> controls only the rendered model. Native calls run on the main thread. See the <a href="https://thatopen.github.io/engine_web-ifc/docs/classes/web-ifc.IfcAPI.html">complete web-ifc API reference</a>.</p>

<script type="module">
import { Viewer } from 'https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js';

const { assets } = JSON.parse(document.getElementById('example-data').textContent);
const viewer = new Viewer('#ifc-viewer');
window.exampleViewer = viewer;
let unsubscribe = () => {};
let running = false, modelID = -1, nativeApi;
const retry = document.getElementById('retry');
async function run() {
    if (running) return;
    running = true;
    retry.hidden = true;
    document.body.dataset.exampleState = 'loading';
    try {
        await viewer.ready;
        if (typeof viewer.onViewChange !== 'function') throw new Error('This SDK version does not support live view events.');
        if (modelID < 0) await loadExampleFile(assets[0].name, assets[0].url, async blob => {
            nativeApi = await viewer.IfcAPI;
            try {
                await nativeApi.Init();
                modelID = nativeApi.OpenModel(new Uint8Array(await blob.arrayBuffer()));
                if (modelID < 0) throw new Error('The native IFC API could not open the model.');
                await viewer.add(assets[0].name, blob);
            } catch (error) {
                if (modelID >= 0) nativeApi.CloseModel(modelID);
                nativeApi.Dispose(); modelID = -1; throw error;
            }
        }, assets[0].bytes);
        subscribe();
        document.body.dataset.exampleState = 'loaded';
    } catch (error) {
        document.body.dataset.exampleState = 'error';
        retry.hidden = false;
        await viewer.setMessage(error.message, { type: 'error' });
    } finally { running = false; }
}
retry.addEventListener('click', () => { void run(); });
window.addEventListener('pagehide', event => {
    unsubscribe();
    if (!event.persisted && nativeApi) {
        if (modelID >= 0) nativeApi.CloseModel(modelID);
        nativeApi.Dispose();
    }
});
window.addEventListener('pageshow', event => {
    if (event.persisted && document.body.dataset.exampleState === 'loaded') subscribe();
});

async function loadExampleFile(name, url, load = blob => viewer.add(name, blob), size = 0) {
    const show = stage => viewer.setMessage(name + ': ' + stage, { type: 'loading' });
    const chunks = [], chunkSize = 4 * 1024 * 1024;
    let offset = 0, attempts = 0, action = 'download', type = '';
    try {
        await show('Downloading');
        while (!size || offset < size) {
            try {
                const end = Math.min(offset + chunkSize, size || Infinity) - 1;
                const response = await fetch(url, {
                    headers: { Range: 'bytes=' + offset + '-' + end },
                    cache: 'no-store', signal: AbortSignal.timeout(60000),
                });
                if (!response.ok) {
                    await response.body?.cancel();
                    // GitHub raw hides Content-Range from browser JavaScript: probe EOF.
                    if (response.status === 416 && offset && !size) break;
                    throw Object.assign(new Error('HTTP ' + response.status), { retry: [408, 429].includes(response.status) || response.status >= 500 });
                }
                const range = response.headers.get('content-range')?.match(/^bytes (\d+)-(\d+)\/(\d+)$/);
                if (range && Number(range[1]) !== offset) throw new TypeError('Unexpected byte range');
                size ||= Number(range?.[3]) || 0;
                const bytes = await response.arrayBuffer();
                const expected = response.status === 206 ? (size ? Math.min(chunkSize, size - offset) : 0) : size;
                if (!bytes.byteLength || (expected && bytes.byteLength !== expected) || (response.status === 206 && bytes.byteLength > chunkSize))
                    throw new TypeError('Incomplete download at byte ' + offset);
                if (response.status === 200) chunks.length = 0; // Server ignored Range.
                chunks.push(bytes);
                offset = response.status === 200 ? bytes.byteLength : offset + bytes.byteLength;
                type = response.headers.get('content-type') || '';
                attempts = 0;
                if (response.status === 200) break;
                await show('Downloading' + (size ? ' ' + Math.round(offset / size * 100) + '%' : ''));
            }
            catch (error) {
                if (error.retry === false || ++attempts === 3) throw error;
                await show('Retrying download');
                await new Promise(resolve => setTimeout(resolve, 500 * 2 ** (attempts - 1)));
            }
        }
        action = 'open';
        const result = await load(new Blob(chunks, { type }), show);
        if (result?.isError) throw new Error('The viewer could not open the file');
        await viewer.setMessage(null);
        return result;
    }
    catch (error) {
        throw new Error('Could not ' + action + ' ' + name + (action === 'download' ? ' from ' + url : '') + ': ' + error.message, { cause: error });
    }
}

const records = new Map();

function scalar(value) {
    if (value === null || value === undefined) return null;
    if (typeof value !== 'object') return value;
    return scalar(Object.hasOwn(value, 'value') ? value.value : value._representationValue);
}

function storeyIndex(root) {
    const result = new Map();
    function visit(node, floor = '') {
        if (String(node.type).toUpperCase() === 'IFCBUILDINGSTOREY') floor = String(scalar(node.Name) ?? 'Unnamed storey');
        if (node.expressID !== undefined) result.set(node.expressID, floor);
        for (const child of node.children ?? []) visit(child, floor);
    }
    visit(root); return result;
}

async function readSelectedRecords(ids) {
    if (!ids.length) return new Map();
    const api = nativeApi;
    const next = new Map();
    const floors = storeyIndex(await api.properties.getSpatialStructure(modelID, true));
    for (const guid of ids) {
        const id = await api.GetExpressIdFromGuid(modelID, guid);
        if (typeof id !== 'number' || id < 1) continue;
        const line = await api.GetLine(modelID, id);
        if (!line || scalar(line.GlobalId) !== guid) continue;
        const sets = await api.properties.getPropertySets(modelID, id, true);
        const properties = sets.flatMap(set => set.HasProperties ?? []);
        const property = name => scalar(properties.find(item => scalar(item.Name) === name)?.NominalValue) ?? '';
        next.set(guid, [String(scalar(line.Name) ?? guid), String(property('Level') || floors.get(id) || ''), String(property('System Classification'))]);
    }
    return next;
}
const tbody = document.getElementById('element-rows');
let selection = [], selectionKey = '';
function selectedIds(view) {
    const components = view.root.content.find(node => node.name === 'Components');
    const selection = components?.content.find(node => node.name === 'Selection');
    return [...new Set((selection?.content ?? [])
        .filter(node => node.name === 'Component')
        .map(node => node.attributes.IfcGuid).filter(Boolean))];
}
function recordFor(id) { return records.get(id) ?? ['Element ' + id, '', '']; }
function renderRows() {
    const rows = selection.map(id => {
        const row = document.createElement('tr');
        row.dataset.ifcGuid = id;
        row.setAttribute('aria-selected', 'true');
        row.title = 'IFC GlobalId: ' + id;
        for (const value of recordFor(id)) {
            const cell = document.createElement('td');
            cell.textContent = value || '—';
            row.append(cell);
        }
        return row;
    });
    if (!rows.length) {
        const row = document.createElement('tr'), cell = document.createElement('td');
        cell.colSpan = 3; cell.textContent = 'No elements selected. Click one in the model.';
        row.append(cell); rows.push(row);
    }
    tbody.replaceChildren(...rows);
    document.querySelector('.table-scroll').scrollTop = 0;
    document.getElementById('selection-count').textContent = selection.length + ' selected';
}
function subscribe() {
    unsubscribe();
    unsubscribe = viewer.onViewChange(view => {
        const ids = selectedIds(view), key = JSON.stringify(ids.slice().sort());
        if (key === selectionKey) return;
        selectionKey = key;
        // A later selection supersedes any unfinished property request.
        void readSelectedRecords(ids).then(next => {
            if (selectionKey !== key) return;
            records.clear(); for (const [id, record] of next) records.set(id, record);
            selection = ids; renderRows();
        }).catch(error => {
            if (selectionKey !== key) return;
            selectionKey = ''; void viewer.setMessage(error.message, { type: 'error' });
        });
    });
}
renderRows();
void run();
</script>
