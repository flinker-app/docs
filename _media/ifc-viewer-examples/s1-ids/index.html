<h2>Check wall information</h2>
<p>Open <strong>IDS</strong> (circled check) on the left toolbar → <strong>Run All Checks</strong>. Expand <strong>Walls · fire-rating information</strong> and click <strong>Apply</strong> beside a failed or passed finding.</p>
<p class="note">Click a wall, then click <strong>1 element selected</strong> at the top left to open <strong>Properties</strong>.</p>
<button id="sample-retry" type="button" hidden>Retry sample</button>
</aside>

<template id="example-guide"><h2 data-example-title>Check wall names and fire-rating information</h2><p data-example-description>Run IDS checks to find walls with missing names or fire-rating values, then highlight passing or failing components.</p><h3>Try it</h3><p>The example opens the three discipline models with their original appearance and loads the two IDS specifications, ready for you to run.</p><p>Open IDS (circled check) on the left toolbar and click Run All Checks. Expand Walls · fire-rating information, then click Apply beside a failed finding to highlight those walls in red, or beside Passed elements to highlight passing walls in green. The SDK applies each finding separately. Click a wall, then click 1 element selected at the top left to open Properties and inspect Pset_WallCommon.FireRating.</p><h3>Expected results</h3><p>The fire-rating information check finds 299 passing structural walls with FireRating = 120, and 353 failing facade walls: 351 have no FireRating property and two have an empty value. The wall-name check finds 301 passing and 351 failing walls. The stairs model contains no applicable walls. These results come from the unchanged source exports.</p><h3>Developer integration</h3><p>Two IDS specifications are embedded alongside the three original IFC discipline models. The SDK runs the IDS checks. Use Run All Checks in the IDS panel to evaluate the loaded models, then Apply on a finding to visualize its results. The example does not calculate separate results or create a BCF overview at startup. Both checks review information completeness. The fire-rating check requires a non-empty Pset_WallCommon.FireRating, not a particular rating; it does not assess fire-safety compliance or represent the project contract.</p><p>Serve this folder over HTTP. The published SDK and source downloads require internet access.</p><h3>Model notes</h3><p>The original IFC source is imported unchanged.</p>
</template>

<script type="module">
import { Viewer } from "https://cdn.flinker.app/ifc-viewer/v4.0.3/ifc-viewer.es.js";
// Example-only download feedback. All file parsing remains in the published SDK.
async function loadExampleFile(name, url, load = blob => viewer.add(name, blob), size = 0) {
    const show = stage => viewer.setMessage(name + ': ' + stage, { type: 'loading' });
    const chunks = [], chunkSize = 4 * 1024 * 1024;
    let offset = 0, attempts = 0, action = 'download', type = '';
    try {
        await show('Downloading');
        while (!size || offset < size) {
            try {
                const end = Math.min(offset + chunkSize, size || Infinity) - 1;
                const response = await fetch(url, {
                    headers: { Range: 'bytes=' + offset + '-' + end },
                    cache: 'no-store', signal: AbortSignal.timeout(60000),
                });
                if (!response.ok) {
                    await response.body?.cancel();
                    // GitHub raw hides Content-Range from browser JavaScript: probe EOF.
                    if (response.status === 416 && offset && !size) break;
                    throw Object.assign(new Error('HTTP ' + response.status), { retry: [408, 429].includes(response.status) || response.status >= 500 });
                }
                const range = response.headers.get('content-range')?.match(/^bytes (\d+)-(\d+)\/(\d+)$/);
                if (range && Number(range[1]) !== offset) throw new TypeError('Unexpected byte range');
                size ||= Number(range?.[3]) || 0;
                const bytes = await response.arrayBuffer();
                const expected = response.status === 206 ? (size ? Math.min(chunkSize, size - offset) : 0) : size;
                if (!bytes.byteLength || (expected && bytes.byteLength !== expected) || (response.status === 206 && bytes.byteLength > chunkSize))
                    throw new TypeError('Incomplete download at byte ' + offset);
                if (response.status === 200) chunks.length = 0; // Server ignored Range.
                chunks.push(bytes);
                offset = response.status === 200 ? bytes.byteLength : offset + bytes.byteLength;
                type = response.headers.get('content-type') || '';
                attempts = 0;
                if (response.status === 200) break;
                await show('Downloading' + (size ? ' ' + Math.round(offset / size * 100) + '%' : ''));
            }
            catch (error) {
                if (error.retry === false || ++attempts === 3) throw error;
                await show('Retrying download');
                await new Promise(resolve => setTimeout(resolve, 500 * 2 ** (attempts - 1)));
            }
        }
        action = 'open';
        const result = await load(new Blob(chunks, { type }), show);
        if (result?.isError) throw new Error('The viewer could not open the file');
        await viewer.setMessage(null);
        return result;
    }
    catch (error) {
        throw new Error('Could not ' + action + ' ' + name + (action === 'download' ? ' from ' + url : '') + ': ' + error.message, { cause: error });
    }
}


const { assets } = JSON.parse(document.getElementById("example-data").textContent);

const viewer = new Viewer('#ifc-viewer');
window.exampleViewer = viewer;
document.body.dataset.exampleState = 'loading';
const imported = new Set();
const retry = document.querySelector('#sample-retry');
let running = false;

async function load() {
    if (running)
        return;
    running = true;
    retry.hidden = true;
    document.body.dataset.exampleState = 'loading';
    try {
        await viewer.ready;
        for (const asset of assets) {
            if (imported.has(asset.id))
                continue;
            await loadExampleFile(asset.name, asset.url, blob => {
                return viewer.add(asset.name, blob);
            }, asset.bytes);
            imported.add(asset.id);
        }
        document.body.dataset.exampleState = 'loaded';
    }
    catch (error) {
        document.body.dataset.exampleState = 'error';
        await viewer.setMessage(error instanceof Error ? error.message : String(error), { type: 'error' });
        retry.hidden = false;
    }
    finally {
        running = false;
    }
}
retry.addEventListener('click', () => { void load(); });
void load();
  </script>
